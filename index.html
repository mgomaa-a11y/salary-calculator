<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الحاسبة المالية المتقدمة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Tajawal', sans-serif; } </style>
</head>
<body class="bg-gray-100 p-4 md:p-8">
    <div class="max-w-3xl mx-auto bg-white rounded-xl shadow-lg p-6">
        <h1 class="text-2xl font-bold text-center text-gray-800 mb-6">الحاسبة المالية وإدارة الميزانية</h1>
        
        <!-- صافي الدخل -->
        <div class="mb-6">
            <label class="block text-sm font-bold text-gray-700 mb-2">الراتب الشهري (صافي الدخل)</label>
            <input type="number" id="income" placeholder="أدخل راتبك الشهري" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
        </div>

        <!-- إضافة المصروفات -->
        <div class="bg-gray-50 p-4 rounded-lg mb-6 border">
            <h2 class="text-lg font-bold text-gray-700 mb-3">المصروفات الأساسية الشهرية</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-3 mb-3">
                <select id="expenseType" class="p-3 border rounded-lg bg-white focus:ring-2 focus:ring-blue-500 outline-none">
                    <option value="سكن (إيجار/تمويل)">سكن (إيجار/تمويل)</option>
                    <option value="فواتير (كهرباء/ماء/إنترنت)">فواتير (كهرباء/ماء/إنترنت)</option>
                    <option value="أقساط قروض/ديون">أقساط قروض/ديون</option>
                    <option value="غذاء ومؤن منزلية">غذاء ومؤن منزلية</option>
                    <option value="مواصلات/بنزين">مواصلات/بنزين</option>
                    <option value="تعليم ورعاية أبناء">تعليم ورعاية أبناء</option>
                    <option value="تأمين (صحي/سيارة)">تأمين (صحي/سيارة)</option>
                    <option value="مصروف آخر">مصروف آخر</option>
                </select>
                <input type="number" id="expenseAmount" placeholder="المبلغ" class="p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                <button onclick="addExpense()" class="bg-green-600 text-white font-bold py-3 rounded-lg hover:bg-green-700 transition">إضافة +</button>
            </div>

            <!-- قائمة المصاريف المضافة -->
            <ul id="expenseList" class="space-y-2 max-h-48 overflow-y-auto mt-4 border-t pt-3">
                <li class="text-sm text-gray-500 text-center py-2" id="emptyMsg">لم يتم إضافة مصاريف بعد</li>
            </ul>
        </div>

        <button onclick="calculateFinance()" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700 transition">تحليل الوضع المالي والخطة</button>

        <!-- النتائج والاقتراحات -->
        <div id="results" class="mt-8 hidden border-t pt-6">
            <h2 class="text-xl font-bold text-gray-800 mb-4">التحليل المالي</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                <div class="bg-gray-100 p-4 rounded-lg text-center">
                    <p class="text-xs text-gray-600">إجمالي المصاريف</p>
                    <p id="totalExpensesText" class="text-lg font-bold text-gray-800">0</p>
                </div>
                <div class="bg-blue-50 p-4 rounded-lg text-center">
                    <p class="text-xs text-gray-600">الصافي المتبقي</p>
                    <p id="remainingAmount" class="text-lg font-bold text-blue-600">0</p>
                </div>
                <div id="statusBox" class="p-4 rounded-lg text-center">
                    <p class="text-xs text-gray-600">حالة الميزانية</p>
                    <p id="savingStatus" class="text-lg font-bold">-</p>
                </div>
            </div>

            <!-- التوصيات والاقتراحات العملية -->
            <div id="recommendations" class="p-5 rounded-lg border"></div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
